  <circle cx="32" cy="10" r="3.5" fill="url(#goldGrad)"/>
  
  <!-- Coiled Serpent -->
  <path d="M26 44 Q38 40 32 34 Q26 28 38 24 Q32 18 26 15" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic ECG QRS Pulse Line -->
