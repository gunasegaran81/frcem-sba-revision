  <!-- Outer Shield / Rounded Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Star of Life / Medical Cross -->
  <path d="M32 8 L32 56 M8 32 L56 32 M15 15 L49 49 M15 49 L49 15" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
