<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="cyanEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Tech Dashes -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="120" cy="120" r="110" fill="url(#coreGlow)" stroke="url(#cyanEdge)" stroke-width="3.5"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="url(#goldEdge)" stroke-width="1" opacity="0.8"/>

  <!-- Star of Life 6-Pointed Emblem (Semi-transparent background motif) -->
  <g transform="translate(120,115) scale(0.72) translate(-120,-120)" fill="url(#cyanEdge)" opacity="0.18">
    <!-- Vertical bar -->
    <path d="M104 20 H136 V90 H170 V120 H170 V150 H136 V220 H104 V150 H70 V120 H70 V90 H104 Z" rx="6"/>
    <!-- 60 deg bar -->
    <g transform="rotate(60 120 120)">
      <path d="M104 20 H136 V90 H170 V120 H170 V150 H136 V220 H104 V150 H70 V120 H70 V90 H104 Z" rx="6"/>
    </g>
    <!-- 120 deg bar -->
    <g transform="rotate(120 120 120)">
      <path d="M104 20 H136 V90 H170 V120 H170 V150 H136 V220 H104 V150 H70 V120 H70 V90 H104 Z" rx="6"/>
    </g>
  </g>

  <!-- Inner Academic Shield -->
  <path d="M80 50 Q120 40 160 50 Q165 110 120 170 Q75 110 80 50 Z" fill="#090d16" stroke="url(#goldEdge)" stroke-width="2" opacity="0.95"/>

  <!-- Rod of Asclepius (Staff of Healing) -->
  <line x1="120" y1="55" x2="120" y2="160" stroke="url(#goldEdge)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="52" r="5" fill="url(#goldEdge)"/>
  
  <!-- Entwined Serpent -->
  <path d="M108 140 Q135 132 120 115 Q105 98 132 85 Q115 72 108 62" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Serpent Head & Eye -->
  <circle cx="109" cy="61" r="3.5" fill="#38bdf8"/>
  <circle cx="110" cy="60" r="1" fill="#020617"/>

  <!-- Glowing ECG Trace (Sinus Rhythm P-Q-R-S-T Complex) -->
  <path d="M20 135 L65 135 L75 128 L85 138 L95 105 L108 175 L120 85 L132 155 L145 125 L155 138 L165 135 L220 135" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Curved Top Text: ROYAL COLLEGE OF EMERGENCY MEDICINE -->
  <path id="textArcTop" d="M35 120 A85 85 0 0 1 205 120" fill="none"/>
  <text fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="800" letter-spacing="2.8">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      EMERGENCY MEDICINE
    </textPath>
  </text>

  <!-- Lower Banner: FRCEM FINAL SBA -->
  <rect x="55" y="182" width="130" height="28" rx="6" fill="#0f172a" stroke="url(#cyanEdge)" stroke-width="1.5"/>
  <text x="120" y="201" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="3" text-anchor="middle">
    FRCEM
  </text>
  <text x="120" y="222" fill="#fde047" font-family="-apple-system, system-ui, sans-serif" font-size="8" font-weight="800" letter-spacing="1.5" text-anchor="middle">
    FINAL SBA REVISION
  </text>
</svg>